name: Build Backend

on:
  push:
    branches: [ main ]

jobs:
  build-back:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Kaniko build
        uses: aevea/action-kaniko@master
        with:
          # Указываем твой реестр
          registry: gitlab:5050
          # Путь к образу: root/test/java-backend
          image: root/test/java-backend
          # Данные берем из твоего примера (root / Qwezxc123$)
          # В идеале их лучше положить в GitHub Secrets
          username: root
          password: Qwezxc123$
          # Тэг — хеш коммита
          tag: ${{ github.sha }}
          path: back-end
          # Указываем правильное имя файла и путь относительно контекста (просто имя файла)
          build_file: dockerfile 
          # Добавляем флаги для работы с локальным/незащищенным реестром
          extra_args: "--insecure --skip-tls-verify --ignore-path=/product_uuid"
