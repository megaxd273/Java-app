apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
data:
  default.conf: |
    server {
      listen 80;

      location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://{{ .Values.nginxConfiguration.backendHost }}:{{ .Values.nginxConfiguration.backendPort }}/;
      }
    }
