replicaCount: 1
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "final"

labels:
  app: frontend

selectorLabels:
  app: frontend


service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "320Mi"

nginxConfiguration:
  backendHost: backend
  backendPort: 8081
